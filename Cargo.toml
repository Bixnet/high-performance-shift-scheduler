[package]
name = "shift-scheduler"
version = "0.1.0"
edition = "2021"
description = "High-performance tabu-search shift scheduler in Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Bixnet/high-performance-shift-scheduler"
keywords = ["scheduling", "tabu-search", "optimization", "rayon", "rust"]
categories = ["command-line-utilities", "algorithms", "science"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
rand = "0.8"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "solver"
harness = false
